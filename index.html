<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Css en tablas</title>
<style>
    table {
        border-collapse: collapse;
        width: 40%;
        margin: auto;}
    th, td {
        border: 2px solid blue;
        padding: 20px;
        text-align: center;}
    tr {
        height: 80px;}
    td {
        vertical-align: center;
        text-align: center;}
    tr:hover {
        background-color: grey;}
    tr:nth-child(even) {
        background-color: aqua;}
</style>
</head>
<body>
<a href="margenes.html">Margenes y padding</a>
<h1>Css en tablas</h1>
<table>
    <tr>
        <th>Artículo</th>
        <th>Precio</th>
    </tr>
    <tr>
        <td>Aceite de Oliva</td>
        <td>10.00€</td>
    </tr>
    <tr>
        <td>Tortas de Alcázar</td>
        <td>6.50€</td>
    </tr>
    <tr>
        <td>Miguelitos de La Roda</td>
        <td>12.00€</td>
    </tr>
</table>
</body>
</html>
